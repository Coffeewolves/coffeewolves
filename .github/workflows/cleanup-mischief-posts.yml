name: Clean up expired Mischief Wall posts

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mischief-post-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Firebase service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WOLVES_CLUB_FB24A }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT_WOLVES_CLUB_FB24A repository secret to enable automatic cleanup."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WOLVES_CLUB_FB24A }}

      - name: Install cleanup dependencies
        working-directory: functions
        run: npm install --omit=dev --no-audit --no-fund

      - name: Migrate existing posts and clean expired media
        if: github.event_name == 'push'
        run: node functions/cleanup_mischief_posts.js --migrate

      - name: Delete expired posts and video chunks
        if: github.event_name != 'push'
        run: node functions/cleanup_mischief_posts.js
