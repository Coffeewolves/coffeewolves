name: wolves_club
description: Prototipo Flutter de Wolves Club - Coffee Wolves.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.8
  firebase_auth: ^4.17.8
  cloud_functions: ^4.6.8
  firebase_storage: ^11.6.8
  firebase_remote_config: ^4.4.7
  country_code_picker: ^3.4.1
  image_picker: ^1.2.0
  local_auth: ^2.3.0
  pdf: ^3.11.3
  printing: ^5.13.1
  firebase_messaging: ^14.9.4
  crypto: ^3.0.7
  http: ^1.6.0
  image: ^4.5.4
  google_mobile_ads: ^6.0.0
  video_player: ^2.10.0
  font_awesome_flutter: ^10.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat-light.ttf
          weight: 300
  assets:
    - assets/audio/
    - assets/audio/aullido.mp3
    - assets/images/coffee_wolves_logo.webp
    - assets/images/bakery/
    - assets/images/desserts/
    - assets/images/hot_drinks/
    - assets/images/menu_official/
    - assets/images/menu_icons/
    - assets/images/experience_icons/
    - assets/images/presurizados/
    - assets/images/wolves/
