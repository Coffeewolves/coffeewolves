# Create or update the signed-in user's profile. The UID comes from the
# Firebase Authentication token so clients cannot create profiles for others.
mutation CreateUserProfile($username: String!, $email: String!)
@auth(level: USER) {
  user_upsert(
    data: {
      id_expr: "auth.uid"
      username: $username
      email: $email
      giftCardBalance: 0
    }
  )
}
